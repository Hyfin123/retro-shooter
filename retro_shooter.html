<!DOCTYPE html>
<html>
<head>
<title>RETRO SHOOTER</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
canvas {
  border: 2px solid #0f0;
  box-shadow: 0 0 20px #0f08, 0 0 60px #0f03;
  image-rendering: pixelated;
}
#info {
  color: #0f06;
  font-size: 11px;
  margin-top: 6px;
  letter-spacing: 2px;
}
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<div id="info">ARROWS/WASD: MOVE &nbsp;|&nbsp; SPACE/Z/SHIFT: SHOOT</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Audio ────────────────────────────────────────────────────────────────────
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type = 'square', vol = 0.08, slide = 0.5) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * slide, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function jingle(...notes) {
  notes.forEach(([f, d, t], i) =>
    setTimeout(() => beep(f, d, t || 'square', 0.12), i * 80));
}

// ── State ────────────────────────────────────────────────────────────────────
let state = 'MENU'; // MENU | PLAYING | LEVEL_UP | GAME_OVER
let score = 0, highScore = 0, wave = 1, frameCount = 0;
let xp = 0, level = 1, xpToNext = 100;

// ── Player ────────────────────────────────────────────────────────────────────
let P;
function resetPlayer() {
  P = { x: W/2, y: H-70, w: 30, h: 30,
        speed: 4, hp: 3, maxHp: 3,
        fireRate: 16, fireCooldown: 0,
        bulletSpeed: 11, bulletDamage: 1,
        multiShot: 1, spread: 14,
        invincible: 0, shield: 0 };
}

// ── Collections ───────────────────────────────────────────────────────────────
let bullets=[], eBullets=[], enemies=[], particles=[], drops=[], stars=[];

// ── Input ─────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
    e.preventDefault();
  if (!keys[e.code]) {
    keys[e.code] = true;
    keys[e.code + '_press'] = true;
  }
  ensureAudio();
  if (e.code === 'Space') {
    if (state === 'MENU') startGame();
    else if (state === 'GAME_OVER') { state = 'MENU'; }
    else if (state === 'LEVEL_UP') confirmUpgrade();
  }
  if (e.code === 'Enter' && state === 'LEVEL_UP') confirmUpgrade();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
function consumePress(code) {
  const v = keys[code + '_press'];
  keys[code + '_press'] = false;
  return v;
}

// ── Stars ─────────────────────────────────────────────────────────────────────
function initStars() {
  stars = Array.from({length: 120}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    spd: 0.4 + Math.random()*2,
    sz: Math.random() < 0.25 ? 2 : 1,
    br: 0.2 + Math.random()*0.8
  }));
}

// ── Upgrades ──────────────────────────────────────────────────────────────────
const UPGRADES = [
  { id:'speed',      name:'SPEED BOOST',  desc:'+25% move speed',      color:'#0ff' },
  { id:'firerate',   name:'RAPID FIRE',   desc:'Faster fire rate',      color:'#ff0' },
  { id:'damage',     name:'POWER SHOT',   desc:'+1 bullet damage',      color:'#f80' },
  { id:'multishot',  name:'MULTI SHOT',   desc:'+1 bullet per shot',    color:'#f0f' },
  { id:'hp',         name:'REPAIR',       desc:'+1 Max HP (heals 1)',   color:'#0f0' },
  { id:'shield',     name:'SHIELD',       desc:'+2 shield charges',     color:'#88f' },
  { id:'velocity',   name:'HYPER SHOT',   desc:'+20% bullet speed',     color:'#ff8' },
  { id:'spread',     name:'WIDE SHOT',    desc:'Wider multi-shot',      color:'#f88' },
];
let upgradeChoices = [], selUpgrade = 0;

function pickUpgrades() {
  upgradeChoices = [...UPGRADES].sort(() => Math.random()-0.5).slice(0, 3);
  selUpgrade = 0;
}
function confirmUpgrade() {
  const u = upgradeChoices[selUpgrade];
  switch(u.id) {
    case 'speed':     P.speed    *= 1.25; break;
    case 'firerate':  P.fireRate  = Math.max(3, P.fireRate - 3); break;
    case 'damage':    P.bulletDamage += 1; break;
    case 'multishot': P.multiShot += 1; break;
    case 'hp':        P.maxHp += 1; P.hp = Math.min(P.hp+1, P.maxHp); break;
    case 'shield':    P.shield += 2; break;
    case 'velocity':  P.bulletSpeed = Math.floor(P.bulletSpeed * 1.2); break;
    case 'spread':    P.spread += 8; break;
  }
  jingle([523,.08],[659,.08],[784,.12]);
  state = 'PLAYING';
}

// ── Enemy factory ─────────────────────────────────────────────────────────────
function mkEnemy(type, x, y) {
  const T = {
    basic:   { w:28, h:20, hp:1,           spd:1.2+wave*.05, xp:10,  sc:100,  col:'#3f3', sr:0   },
    fast:    { w:18, h:14, hp:1,           spd:3.0+wave*.08, xp:15,  sc:150,  col:'#0ff', sr:0   },
    tank:    { w:36, h:28, hp:3+wave,      spd:0.7,          xp:35,  sc:350,  col:'#f80', sr:0   },
    shooter: { w:26, h:22, hp:2,           spd:0.9,          xp:25,  sc:250,  col:'#f0f', sr:110 },
    zigzag:  { w:22, h:18, hp:1,           spd:1.5,          xp:20,  sc:200,  col:'#ff0', sr:0   },
    boss:    { w:72, h:52, hp:20+wave*8,   spd:0.6,          xp:250, sc:3000, col:'#f33', sr:55  },
  }[type] || {};
  return {
    x, y, w:T.w, h:T.h, hp:T.hp, maxHp:T.hp,
    spd:T.spd, type, col:T.col, xp:T.xp, sc:T.sc,
    sr:T.sr, sc2:Math.floor(Math.random()*(T.sr||1)),
    vx:0, vy:T.spd, age:0
  };
}

function spawnWave() {
  enemies = [];
  const isBoss = wave % 5 === 0;
  if (isBoss) {
    enemies.push(mkEnemy('boss', W/2-36, -70));
    return;
  }
  const pool = ['basic'];
  if (wave>=2) pool.push('fast');
  if (wave>=3) pool.push('zigzag');
  if (wave>=4) pool.push('shooter');
  if (wave>=6) pool.push('tank');

  const n = Math.min(4 + wave*2, 40);
  const cols = Math.min(n, 8);
  const rows = Math.ceil(n/cols);
  for (let r=0; r<rows; r++)
    for (let c=0; c<cols && enemies.length<n; c++) {
      const t = pool[Math.floor(Math.random()*pool.length)];
      enemies.push(mkEnemy(t,
        44 + c*((W-88)/(cols-1||1)),
        -50 - r*55
      ));
    }
}

// ── Game start ────────────────────────────────────────────────────────────────
function startGame() {
  score=0; wave=1; xp=0; level=1; xpToNext=100;
  bullets=[]; eBullets=[]; enemies=[]; particles=[]; drops=[]; frameCount=0;
  resetPlayer();
  spawnWave();
  state = 'PLAYING';
}

// ── Shooting ──────────────────────────────────────────────────────────────────
function shoot() {
  beep(880, 0.04, 'square', 0.04);
  for (let i=0; i<P.multiShot; i++) {
    const off = (i - (P.multiShot-1)/2) * P.spread;
    const ang = (off/W) * Math.PI * 0.9;
    bullets.push({
      x: P.x + off*0.5, y: P.y - P.h/2,
      vx: Math.sin(ang) * P.bulletSpeed * 0.35,
      vy: -P.bulletSpeed * Math.cos(ang),
      w:4, h:12, dmg: P.bulletDamage
    });
  }
}

// ── Particles ─────────────────────────────────────────────────────────────────
function burst(x, y, col, n=8, speed=4) {
  for (let i=0; i<n; i++) {
    const a = (Math.PI*2*i/n) + Math.random()*.6;
    const s = 0.8 + Math.random()*speed;
    particles.push({
      x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:1, decay:0.018+Math.random()*.03,
      sz:2+Math.random()*4, col
    });
  }
}

// ── XP / Level ────────────────────────────────────────────────────────────────
function gainXP(n) {
  xp += n;
  while (xp >= xpToNext) {
    xp -= xpToNext;
    level++;
    xpToNext = Math.floor(xpToNext * 1.45);
    pickUpgrades();
    state = 'LEVEL_UP';
  }
}

// ── Hit player ────────────────────────────────────────────────────────────────
function hitPlayer(dmg) {
  if (P.shield > 0) {
    P.shield = Math.max(0, P.shield - dmg);
    burst(P.x, P.y, '#88f', 6, 3);
    beep(220, 0.1, 'square', 0.06);
    return;
  }
  P.hp -= dmg;
  P.invincible = 100;
  burst(P.x, P.y, '#0f0', 10, 5);
  beep(110, 0.22, 'sawtooth', 0.1);
  if (P.hp <= 0) {
    highScore = Math.max(highScore, score);
    burst(P.x, P.y, '#0f0', 25, 7);
    state = 'GAME_OVER';
  }
}

// ── Rect overlap ──────────────────────────────────────────────────────────────
function overlap(ax,ay,aw,ah, bx,by,bw,bh) {
  return Math.abs(ax-bx) < (aw+bw)/2-2 && Math.abs(ay-by) < (ah+bh)/2-2;
}

// ── Update ────────────────────────────────────────────────────────────────────
function update() {
  frameCount++;

  stars.forEach(s => { s.y += s.spd; if(s.y>H) { s.y=0; s.x=Math.random()*W; } });

  if (state === 'MENU' || state === 'GAME_OVER') return;

  if (state === 'LEVEL_UP') {
    if (consumePress('ArrowUp')   || consumePress('KeyW')) selUpgrade = Math.max(0, selUpgrade-1);
    if (consumePress('ArrowDown') || consumePress('KeyS')) selUpgrade = Math.min(2, selUpgrade+1);
    return;
  }

  // — Player move —
  if ((keys['ArrowLeft']  || keys['KeyA']) && P.x > P.w/2)       P.x -= P.speed;
  if ((keys['ArrowRight'] || keys['KeyD']) && P.x < W-P.w/2)     P.x += P.speed;
  if ((keys['ArrowUp']    || keys['KeyW']) && P.y > H/2+P.h/2)   P.y -= P.speed*.7;
  if ((keys['ArrowDown']  || keys['KeyS']) && P.y < H-P.h/2)     P.y += P.speed*.7;

  // — Shoot —
  if (P.fireCooldown > 0) P.fireCooldown--;
  if ((keys['Space'] || keys['KeyZ'] || keys['ShiftLeft']) && P.fireCooldown === 0) {
    shoot(); P.fireCooldown = P.fireRate;
  }
  if (P.invincible > 0) P.invincible--;

  // — Move bullets —
  bullets = bullets.filter(b => {
    b.x += b.vx; b.y += b.vy;
    return b.y > -30 && b.x > -10 && b.x < W+10;
  });
  eBullets = eBullets.filter(b => {
    b.x += b.vx; b.y += b.vy;
    return b.y < H+30;
  });

  // — Move enemies —
  enemies.forEach(e => {
    e.age++;
    if (e.type === 'zigzag') {
      e.x += Math.sin(e.age * 0.06) * 2.8;
      e.y += e.spd * 0.6;
    } else if (e.type === 'boss') {
      e.x = W/2 + Math.sin(e.age*0.018)*(W/2-55);
      if (e.y < 65) e.y += 0.6;
    } else {
      e.y += e.vy;
    }
    // Enemy shoot
    if (e.sr > 0) {
      if (e.sc2 <= 0) {
        const dx = P.x-e.x, dy = P.y-e.y;
        const d = Math.hypot(dx,dy);
        const spd = e.type==='boss' ? 4.5 : 2.8;
        const n = e.type==='boss' ? 3 : 1;
        for (let i=0; i<n; i++) {
          const a = Math.atan2(dy,dx) + (i-(n-1)/2)*.3;
          eBullets.push({ x:e.x, y:e.y+e.h/2, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, w:7, h:7, dmg:e.type==='boss'?2:1 });
        }
        beep(180, 0.07, 'sawtooth', 0.025);
        e.sc2 = e.sr + Math.floor(Math.random()*40);
      } else e.sc2--;
    }
  });

  // — Bullet vs enemy —
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (b.y < -20) return;
      if (overlap(b.x,b.y,b.w,b.h, e.x,e.y,e.w,e.h)) {
        e.hp -= b.dmg;
        burst(b.x, b.y, e.col, 4, 3);
        b.y = -999;
        if (e.hp <= 0) {
          burst(e.x, e.y, e.col, e.type==='boss'?24:10);
          score += e.sc;
          gainXP(e.xp);
          if (Math.random()<0.14) drops.push({ x:e.x, y:e.y, type:Math.random()<.55?'hp':'shield', vy:1.5 });
          beep(e.type==='boss'?90:260, 0.18, 'square', 0.07, 0.3);
          e.hp = 9999;
        }
      }
    });
  });

  bullets  = bullets.filter(b => b.y > -30);
  enemies  = enemies.filter(e => e.hp < 9000 && e.y < H+120);

  // — Enemy vs player —
  if (P.invincible === 0) {
    enemies.forEach(e => {
      if (overlap(P.x,P.y,P.w-6,P.h-6, e.x,e.y,e.w,e.h)) {
        hitPlayer(1);
        e.hp--;
        if (e.hp<=0) { burst(e.x,e.y,e.col,10); e.hp=9999; }
      }
    });
    eBullets.forEach(b => {
      if (overlap(P.x,P.y,P.w-6,P.h-6, b.x,b.y,b.w,b.h)) {
        hitPlayer(b.dmg); b.y = H+999;
      }
    });
  }
  eBullets = eBullets.filter(b => b.y < H+50);

  // — Drops —
  drops.forEach(d => { d.y += d.vy; });
  drops = drops.filter(d => {
    if (Math.hypot(d.x-P.x, d.y-P.y) < 22) {
      if (d.type==='hp') { P.hp=Math.min(P.hp+1,P.maxHp); jingle([440,.07,'sine'],[550,.1,'sine']); }
      else { P.shield+=1; jingle([550,.07,'sine'],[660,.1,'sine']); }
      return false;
    }
    return d.y < H+30;
  });

  // — Particles —
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=p.decay; });
  particles = particles.filter(p => p.life > 0);

  // — Next wave —
  if (enemies.length === 0) {
    wave++;
    spawnWave();
    gainXP(60 + wave*12);
    jingle([392,.08],[523,.08],[659,.12]);
  }
}

// ── Draw helpers ──────────────────────────────────────────────────────────────
function px(x,y,w,h,col) { ctx.fillStyle=col; ctx.fillRect(Math.floor(x),Math.floor(y),w,h); }
function text(t,x,y,col,sz='16px',align='left') {
  ctx.fillStyle=col; ctx.font=`${sz} "Courier New"`; ctx.textAlign=align; ctx.fillText(t,x,y);
}

// ── Draw player ───────────────────────────────────────────────────────────────
function drawPlayer() {
  if (P.invincible>0 && Math.floor(frameCount/4)%2===0) return;
  const x=Math.floor(P.x), y=Math.floor(P.y);
  if (P.shield>0) {
    ctx.strokeStyle=`rgba(136,136,255,${0.5+Math.sin(frameCount*.15)*.4})`;
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y,26,0,Math.PI*2); ctx.stroke();
  }
  // wings
  px(x-16, y+2,  32, 7, '#0a0');
  px(x-12, y-6,  24, 8, '#0c0');
  // hull
  px(x-4,  y-18, 8, 36, '#0e0');
  // cannon
  px(x-2,  y-22, 4, 6, '#0ff');
  // cockpit
  px(x-4,  y-14, 8, 10, '#0ff');
  // engines
  const eng = frameCount%6<3 ? '#ff8' : '#f60';
  px(x-4,  y+16, 8, 5,  eng);
  px(x-14, y+9,  5, 4,  eng);
  px(x+9,  y+9,  5, 4,  eng);
}

// ── Draw enemy ────────────────────────────────────────────────────────────────
function drawEnemy(e) {
  const x=Math.floor(e.x), y=Math.floor(e.y);
  const c=e.col;
  if (e.type==='boss') {
    px(x-36,y-22, 72,48, c);
    px(x-24,y-38, 48,18, c);
    px(x-16,y+22, 32,14, c);
    px(x-20,y-12, 40,24, '#f88');
    px(x-8, y-8,  16,16, '#ff0');
    // hp bar
    px(x-36,y-50, 72,7, '#330');
    px(x-36,y-50, Math.floor(72*(e.hp/e.maxHp)),7, '#f33');
  } else if (e.type==='tank') {
    px(x-18,y-14, 36,28, c);
    px(x-8, y-22, 16,10, '#fa0');
    px(x-2, y-26, 4, 6, '#ff0');
  } else if (e.type==='shooter') {
    px(x-13,y-11, 26,22, c);
    px(x-4, y+9,  8, 9, '#f8f');
    px(x-2, y+16, 4, 5, '#fff');
  } else if (e.type==='zigzag') {
    px(x-4, y-16, 8, 8, c);
    px(x-8, y-8,  16,8, c);
    px(x-12,y,    24,8, c);
  } else if (e.type==='fast') {
    px(x-4, y-10, 8, 20, c);
    px(x-9, y+2,  18,7, c);
  } else {
    // basic alien
    px(x-14,y-10, 28,20, c);
    px(x-10,y-18, 20,8,  c);
    px(x-18,y+4,  8, 6,  c);
    px(x+10, y+4, 8, 6,  c);
    px(x-8, y-8,  6, 6, '#000');
    px(x+2,  y-8, 6, 6, '#000');
    px(x-4, y+2,  8, 4, '#000');
  }
}

// ── Draw HUD ──────────────────────────────────────────────────────────────────
function drawHUD() {
  text(`SCORE:${score}`, 8, 22, '#0f0', '15px');
  text(`HI:${highScore}`, W-8, 22, '#0f0', '15px', 'right');
  text(`WAVE:${wave}`, W/2, 22, '#ff0', '15px', 'center');

  // HP boxes
  text('HP', 8, H-38, '#0f0', '13px');
  for (let i=0; i<P.maxHp; i++) {
    ctx.fillStyle = i<P.hp ? '#0f0' : '#222';
    ctx.fillRect(32+i*18, H-50, 14, 14);
    ctx.strokeStyle='#0a0'; ctx.lineWidth=1;
    ctx.strokeRect(32+i*18, H-50, 14, 14);
  }

  // Shield
  if (P.shield>0) { text(`SH:${P.shield}`, 8, H-22, '#88f', '13px'); }

  // Level + XP bar
  text(`LVL:${level}`, W-8, H-36, '#ff0', '13px', 'right');
  ctx.fillStyle='#330'; ctx.fillRect(W-118, H-24, 110, 8);
  ctx.fillStyle='#ff0'; ctx.fillRect(W-118, H-24, Math.floor(110*(xp/xpToNext)), 8);
  ctx.strokeStyle='#660'; ctx.lineWidth=1; ctx.strokeRect(W-118, H-24, 110, 8);
  text('XP', W-128, H-17, '#880', '11px', 'right');
}

// ── Screens ───────────────────────────────────────────────────────────────────
function drawMenu() {
  text('RETRO', W/2, H/2-75, '#0f0', 'bold 52px', 'center');
  text('SHOOTER', W/2, H/2-18, '#0ff', 'bold 52px', 'center');
  if (Math.floor(frameCount/28)%2===0)
    text('— PRESS SPACE TO START —', W/2, H/2+45, '#ff0', '18px', 'center');
  text('ARROWS / WASD : MOVE', W/2, H/2+95, '#666', '13px', 'center');
  text('SPACE / Z / SHIFT : SHOOT', W/2, H/2+115, '#666', '13px', 'center');
  text('LEVEL UP → CHOOSE UPGRADE', W/2, H/2+140, '#666', '13px', 'center');
  if (highScore>0) text(`HI SCORE: ${highScore}`, W/2, H/2+178, '#f80', '16px', 'center');
}

function drawLevelUp() {
  ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(0,0,W,H);
  text('⚡ LEVEL UP! ⚡', W/2, H/2-118, '#ff0', 'bold 30px', 'center');
  text(`NOW LEVEL ${level}`, W/2, H/2-82, '#fff', '17px', 'center');
  text('CHOOSE AN UPGRADE:', W/2, H/2-54, '#aaa', '14px', 'center');

  upgradeChoices.forEach((u,i) => {
    const gy = H/2-28 + i*72;
    const sel = i===selUpgrade;
    ctx.fillStyle = sel ? u.color : '#1a1a1a';
    ctx.fillRect(W/2-165, gy, 330, 58);
    ctx.strokeStyle = sel ? u.color : '#444';
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(W/2-165, gy, 330, 58);
    ctx.fillStyle = sel ? '#000' : u.color;
    ctx.font = `bold 17px "Courier New"`; ctx.textAlign='center';
    ctx.fillText(u.name, W/2, gy+24);
    ctx.fillStyle = sel ? '#111' : '#888';
    ctx.font = `13px "Courier New"`;
    ctx.fillText(u.desc, W/2, gy+44);
  });
  ctx.textAlign='left';
  if (Math.floor(frameCount/20)%2===0)
    text('↑↓ SELECT   SPACE/ENTER CONFIRM', W/2, H-28, '#555', '12px', 'center');
}

function drawGameOver() {
  ctx.fillStyle='rgba(0,0,0,.88)'; ctx.fillRect(0,0,W,H);
  text('GAME OVER', W/2, H/2-62, '#f33', 'bold 46px', 'center');
  text(`SCORE : ${score}`, W/2, H/2+4,  '#fff', '20px', 'center');
  text(`WAVE  : ${wave}`,  W/2, H/2+32, '#fff', '18px', 'center');
  text(`LEVEL : ${level}`, W/2, H/2+58, '#fff', '18px', 'center');
  if (score>0 && score>=highScore)
    text('★ NEW HIGH SCORE ★', W/2, H/2+90, '#ff0', '16px', 'center');
  if (Math.floor(frameCount/28)%2===0)
    text('PRESS SPACE TO CONTINUE', W/2, H/2+128, '#0f0', '16px', 'center');
}

// ── Scanlines ──────────────────────────────────────────────────────────────────
function scanlines() {
  ctx.fillStyle='rgba(0,0,0,.09)';
  for (let y=0; y<H; y+=4) ctx.fillRect(0,y,W,2);
}

// ── Drop render ────────────────────────────────────────────────────────────────
function drawDrops() {
  drops.forEach(d => {
    const bob = Math.sin(frameCount*.15)*2;
    ctx.fillStyle = d.type==='hp' ? '#0f0' : '#88f';
    ctx.fillRect(d.x-9, d.y-9+bob, 18, 18);
    ctx.fillStyle='#000';
    ctx.font='bold 13px "Courier New"'; ctx.textAlign='center';
    ctx.fillText(d.type==='hp' ? '+' : 'S', d.x, d.y+5+bob);
    ctx.textAlign='left';
  });
}

// ── Main draw ─────────────────────────────────────────────────────────────────
function draw() {
  px(0,0,W,H,'#000');

  // Stars
  stars.forEach(s => {
    ctx.fillStyle=`rgba(255,255,255,${s.br})`;
    ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.sz, s.sz);
  });

  if (state==='MENU')     { drawMenu();     scanlines(); return; }
  if (state==='GAME_OVER'){ drawGameOver(); scanlines(); return; }

  // Game world
  drawDrops();
  enemies.forEach(drawEnemy);
  drawPlayer();

  // Player bullets
  ctx.fillStyle='#ff4';
  bullets.forEach(b => ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h));

  // Enemy bullets
  ctx.fillStyle='#f44';
  eBullets.forEach(b => ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h));

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.sz/2, p.y-p.sz/2, p.sz, p.sz);
  });
  ctx.globalAlpha=1;

  drawHUD();
  if (state==='LEVEL_UP') drawLevelUp();
  scanlines();
}

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }
initStars();
loop();
</script>
</body>
</html>
